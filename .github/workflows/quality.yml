name: Quality

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: development
      DB_SCHEMA_CHECK: "false"
      OTEL_ENABLED: "false"
      TIMESCALE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
      TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
      ALEMBIC_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt
            requirements-test.txt
      - name: Install runtime and development dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps -e .
      - name: Ruff
        run: python -m ruff check .
      - name: Verify migrations against PostgreSQL
        run: |
          python -m alembic upgrade head
          python -m alembic check
      - name: Backend and PostgreSQL integration tests
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend run test:run
      - run: npm --prefix frontend run build
