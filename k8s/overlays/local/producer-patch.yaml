apiVersion: apps/v1
kind: Deployment
metadata:
  name: producer
  namespace: tradingmaster
spec:
  template:
    spec:
      containers:
        - name: producer
          imagePullPolicy: Never
          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
