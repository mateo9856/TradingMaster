apiVersion: v1
kind: Secret
metadata:
  name: tradingmaster-secrets
  namespace: tradingmaster
type: Opaque
stringData:
  TIMESCALE_URL: "postgresql+asyncpg://user:mysecretpassword@postgres-service:5432/tradingmaster"
  KAFKA_BOOTSTRAP_SERVERS: "kafka-service:9092"
  BINANCE_API_KEY: ""
  BINANCE_API_SECRET: ""
  POSTGRES_USER: "user"
  POSTGRES_PASSWORD: "mysecretpassword"
  POSTGRES_DB: "tradingmaster"
  GRAFANA_ADMIN_PASSWORD: "admin"
  # Local cluster is plain http, so the session cookie can't be Secure-only.
  AUTH_COOKIE_SECURE: "false"
  # Generate unique ID with:
  # python3 -c "import uuid,base64; print(base64.urlsafe_b64encode(uuid.uuid4().bytes).decode().rstrip('='))"
  KAFKA_CLUSTER_ID: ""   # ← paste generated value here