apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tradingmaster

bases:
  - ../../base

resources:
  - secrets.yaml

patches:
  - path: fastapi-patch.yaml
  - path: observability-patch.yaml

# Point to your real container registry in production
# e.g. Docker Hub, AWS ECR, Google GCR
images:
  - name: tradingmaster-api
    newName: your-registry/tradingmaster-api   # ← replace with your registry
    newTag: "1.0.0"
  - name: tradingmaster-flink
    newName: your-registry/tradingmaster-flink
    newTag: "1.0.0"