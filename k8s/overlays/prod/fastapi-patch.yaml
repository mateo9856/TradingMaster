# Patch 1 — LoadBalancer for external traffic in production
apiVersion: v1
kind: Service
metadata:
  name: fastapi-service
  namespace: tradingmaster
spec:
  type: LoadBalancer

---
# Patch 2 — more replicas and resources in production
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi
  namespace: tradingmaster
spec:
  replicas: 3           # 3 instances for high availability
  template:
    spec:
      containers:
        - name: fastapi
          imagePullPolicy: Always   # always pull latest from registry
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

---
# Patch 3 — more Flink resources in production
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-candle-builder
  namespace: tradingmaster
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: flink-candle-builder
          imagePullPolicy: Always
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"