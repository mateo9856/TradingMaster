# Patch 1 — LoadBalancer for external traffic in production
apiVersion: v1
kind: Service
metadata:
  name: fastapi-service
  namespace: tradingmaster
spec:
  type: LoadBalancer

---
# Patch 2 — more replicas and resources in production
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi
  namespace: tradingmaster
spec:
  replicas: 3           # 3 instances for high availability
  template:
    spec:
      containers:
        - name: fastapi
          imagePullPolicy: Always   # always pull latest from registry
          env:
            # Turns on the strict startup checks in app/config.py:
            # validate_config() refuses to boot on the dev AUTH_SECRET, on an
            # empty one, or with a non-HTTPS cookie.
            - name: APP_ENV
              value: "production"
            # fastapi-service is a LoadBalancer here, so /docs, /redoc and
            # /openapi.json would otherwise publish the whole endpoint surface.
            - name: DOCS_ENABLED
              value: "false"
            # The LoadBalancer sets X-Forwarded-For, so per-IP rate limits
            # should count the real client rather than the proxy.
            - name: TRUST_PROXY_HEADERS
              value: "true"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

---
# Patch 3 — more Flink resources in production
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-candle-builder
  namespace: tradingmaster
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: flink-candle-builder
          imagePullPolicy: Always
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"