# Patch 1 — LoadBalancer for external traffic in production
apiVersion: v1
kind: Service
metadata:
  name: fastapi-service
  namespace: tradingmaster
spec:
  type: LoadBalancer

---
# Patch 2 — more replicas and resources in production
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi
  namespace: tradingmaster
spec:
  replicas: 3           # 3 instances for high availability
  template:
    spec:
      containers:
        - name: fastapi
          imagePullPolicy: Always   # always pull latest from registry
          env:
            # Turns on the strict startup checks in app/config.py:
            # validate_config() refuses to boot on the dev AUTH_SECRET, on an
            # empty one, or with a non-HTTPS cookie.
            - name: APP_ENV
              value: "production"
            # fastapi-service is a LoadBalancer here, so /docs, /redoc and
            # /openapi.json would otherwise publish the whole endpoint surface.
            - name: DOCS_ENABLED
              value: "false"
            # The LoadBalancer sets X-Forwarded-For, so per-IP rate limits
            # should count the real client rather than the proxy.
            - name: TRUST_PROXY_HEADERS
              value: "true"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

---
# Patch 3 — more Flink resources in production
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-candle-builder
  namespace: tradingmaster
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: flink-candle-builder
          imagePullPolicy: Always
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"

---
# Keep the collector at one replica. Its PostgreSQL lock remains a second
# guard against manual or accidental duplicate starts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: producer
  namespace: tradingmaster
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: producer
          imagePullPolicy: Always
          env:
            - name: APP_ENV
              value: "production"
            - name: PRODUCER_METRICS_PORT
              value: "9103"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"

---
# The Flink job uses the external TLS endpoints from the production secret,
# overriding the in-cluster plaintext development defaults in the base.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-candle-builder
  namespace: tradingmaster
spec:
  template:
    spec:
      containers:
        - name: flink-candle-builder
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                secretKeyRef:
                  name: tradingmaster-secrets
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: TIMESCALE_JDBC_URL
              valueFrom:
                secretKeyRef:
                  name: tradingmaster-secrets
                  key: TIMESCALE_JDBC_URL
            - name: TIMESCALE_USER
              valueFrom:
                secretKeyRef:
                  name: tradingmaster-secrets
                  key: TIMESCALE_USER
            - name: TIMESCALE_PASS
              valueFrom:
                secretKeyRef:
                  name: tradingmaster-secrets
                  key: TIMESCALE_PASS
