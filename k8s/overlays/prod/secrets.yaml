apiVersion: v1
kind: Secret
metadata:
  name: tradingmaster-secrets
  namespace: tradingmaster
type: Opaque
stringData:
  # !! Replace all values with real production credentials !!
  TIMESCALE_URL: "postgresql+asyncpg://prod_user:prod_password@prod-db-host:5432/tradingmaster"
  KAFKA_BOOTSTRAP_SERVERS: "prod-kafka-host:9092"
  BINANCE_API_KEY: "your-binance-key"
  BINANCE_API_SECRET: "your-binance-secret"
  KRAKEN_API_KEY: "your-kraken-key"
  KRAKEN_API_SECRET: "your-kraken-secret"
  COINBASE_API_KEY: "your-coinbase-key"
  COINBASE_API_SECRET: "your-coinbase-secret"
  POSTGRES_USER: "prod_user"
  POSTGRES_PASSWORD: "prod_password"
  POSTGRES_DB: "tradingmaster"
  GRAFANA_ADMIN_PASSWORD: "your-grafana-admin-password"
  # Generate unique ID with:
  # python3 -c "import uuid,base64; print(base64.urlsafe_b64encode(uuid.uuid4().bytes).decode().rstrip('='))"
  KAFKA_CLUSTER_ID: ""   # ← paste generated value here