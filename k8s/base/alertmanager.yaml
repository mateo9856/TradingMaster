# Alertmanager — the delivery path for the rules in prometheus.yaml's
# ConfigMap. The receiver is a no-op on purpose: wiring email/Slack/PagerDuty
# becomes a ConfigMap edit rather than a code change. See
# observability/alertmanager/alertmanager.yml for the Compose equivalent.
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: tradingmaster
data:
  alertmanager.yml: |
    route:
      receiver: default
      group_by: ["alertname", "component"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        - matchers: ['severity = "critical"']
          receiver: default
          repeat_interval: 1h
    receivers:
      - name: default
    inhibit_rules:
      - source_matchers: ['alertname = "EodArchiveFailed"']
        target_matchers: ['alertname = "EodArchiveStale"']
        equal: ["component"]

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: tradingmaster
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          args:
            - "--config.file=/etc/alertmanager/alertmanager.yml"
            - "--storage.path=/alertmanager"
          ports:
            - containerPort: 9093
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
            - name: data
              mountPath: /alertmanager
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        - name: data
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager-service
  namespace: tradingmaster
spec:
  selector:
    app: alertmanager
  ports:
    - port: 9093
      targetPort: 9093
  type: ClusterIP
