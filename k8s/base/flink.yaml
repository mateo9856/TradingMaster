apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-candle-builder
  namespace: tradingmaster
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flink-candle-builder
  template:
    metadata:
      labels:
        app: flink-candle-builder
    spec:
      containers:
        - name: flink-candle-builder
          image: tradingmaster-flink:latest
          envFrom:
            - secretRef:
                name: tradingmaster-secrets
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-service:9092"
            - name: TIMESCALE_JDBC_URL
              value: "jdbc:postgresql://postgres-service:5432/tradingmaster"
            - name: TIMESCALE_USER
              value: "user"
            - name: TIMESCALE_PASS
              value: "mysecretpassword"
            - name: OTEL_ENABLED
              value: "true"
            - name: FLINK_METRICS_PROMETHEUS_PORT
              value: "9250-9260"
            - name: FLINK_CHECKPOINT_INTERVAL
              value: "30s"
            - name: FLINK_TOPIC_DISCOVERY_INTERVAL
              value: "60s"
          ports:
            - containerPort: 9250
              name: metrics
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

---
apiVersion: v1
kind: Service
metadata:
  name: flink-candle-builder-service
  namespace: tradingmaster
spec:
  selector:
    app: flink-candle-builder
  ports:
    - name: metrics
      port: 9250
      targetPort: 9250
  type: ClusterIP