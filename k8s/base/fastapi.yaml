apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi
  namespace: tradingmaster
spec:
  replicas: 1           # overridden per environment
  selector:
    matchLabels:
      app: fastapi
  template:
    metadata:
      labels:
        app: fastapi
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      # The schema is applied by the db-migrate Job, never by an API pod: with
      # replicas > 1, per-pod migrations would race on DDL. Each pod just waits
      # until the database reports the head revision, so a rollout can't start
      # serving against a schema the code doesn't match.
      initContainers:
        - name: wait-for-migrations
          image: tradingmaster-api:latest
          command: ["python", "-m", "app.models.schema_check", "--wait", "--timeout", "300"]
          envFrom:
            - secretRef:
                name: tradingmaster-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
      containers:
        - name: fastapi
          image: tradingmaster-api:latest
          ports:
            - containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          envFrom:
            - secretRef:
                name: tradingmaster-secrets
          env:
            - name: OTEL_ENABLED
              value: "true"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://jaeger-service:4317"
            - name: OTEL_SERVICE_NAME
              value: "tradingmaster-api"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:         # overridden per environment
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: fastapi-service
  namespace: tradingmaster
spec:
  selector:
    app: fastapi
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP         # overridden per environment