apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: tradingmaster
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.60
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
          ports:
            - containerPort: 16686
              name: ui
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          # NOTE: in-memory storage (no volume) — traces don't survive a pod
          # restart. Fine for local/dev; production needs a real Jaeger
          # storage backend (Elasticsearch/Cassandra), not implemented here.

---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-service
  namespace: tradingmaster
spec:
  selector:
    app: jaeger
  ports:
    - name: ui
      port: 16686
      targetPort: 16686
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
  type: ClusterIP         # UI port overridden per environment
