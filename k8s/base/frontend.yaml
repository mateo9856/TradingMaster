apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: tradingmaster
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: tradingmaster-frontend:latest
          ports:
            - containerPort: 8080
          env:
            # In-cluster the API is a Service, so the UI and the API stay one
            # origin from the browser's point of view (nginx proxies /api).
            - name: API_HOST
              value: "fastapi-service:8000"
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: "20m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: tradingmaster
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 8080
  type: ClusterIP
