# Runs the EOD archive job once a day, independent of the FastAPI Deployment's
# lifecycle — a crashed/redeployed API pod should never silently skip a day's
# archive run. Reuses the same image as fastapi.yaml (it already has the full
# app/ package + dependencies installed); only the command differs.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: eod-archive
  namespace: tradingmaster
spec:
  # 23:30 UTC — 30 minutes before the day rolls over, so the run completes
  # (and, if it fails, backoffLimit retries have a chance to complete too)
  # before RETENTION_DAYS-based cleanup math ticks over to the next day.
  # With no target_date arg, app/eod_runner.py still archives *yesterday*
  # (UTC), so running slightly before midnight rather than slightly after it
  # doesn't change which day gets archived — it just leaves margin.
  # Override per environment with a `spec.schedule` patch (see
  # k8s/overlays/local/eod-patch.yaml for an example).
  schedule: "30 23 * * *"
  concurrencyPolicy: Forbid
  # If the controller is down at the scheduled minute, still run when it comes
  # back — but only if it's within the hour, so a long outage doesn't fire a
  # burst of catch-up runs at once.
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Safe now that the archive is idempotent: a retry re-reads the same day
      # and skips whatever the failed attempt already wrote. Before the unique
      # key on candles_history, these two retries were the most reliable way to
      # get three copies of a day into history.
      backoffLimit: 2
      # Give up rather than retry forever into the next day's run.
      activeDeadlineSeconds: 7200
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            # Needed by k8s/base/network-policy.yaml to allow this pod through
            # to PostgreSQL — without a label it matches no `from` selector and
            # the archive silently cannot reach the database.
            app: eod-archive
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: eod-archive
              image: tradingmaster-api:latest
              command: ["python", "-m", "app.eod_runner"]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              envFrom:
                - secretRef:
                    name: tradingmaster-secrets
              env:
                - name: OTEL_ENABLED
                  value: "true"
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: "http://jaeger-service:4317"
                - name: OTEL_SERVICE_NAME
                  value: "tradingmaster-eod"
              resources:
                requests:
                  cpu: "100m"
                  memory: "128Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"
