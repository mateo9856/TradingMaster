apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: tradingmaster
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: fastapi
        metrics_path: /metrics
        static_configs:
          - targets: ["fastapi-service:80"]
      - job_name: flink
        static_configs:
          - targets: ["flink-candle-builder-service:9250"]

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: tradingmaster
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}   # overridden with a PVC in the prod overlay

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
  namespace: tradingmaster
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
  type: ClusterIP
