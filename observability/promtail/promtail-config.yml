server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container
      - source_labels: [container]
        target_label: service
    pipeline_stages:
      - json:
          expressions:
            level: levelname
            logger: name
            service: service
            trace_id: trace_id
      # Keep level/service as low-cardinality labels; trace_id stays out of
      # labels and is queried as structured metadata to avoid a label
      # cardinality blowup (trace IDs are effectively unique per request).
      - labels:
          level:
          service:
