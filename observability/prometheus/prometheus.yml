global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # The API as a Compose service. If you run it on the host instead
  # (uvicorn --reload), swap the target for "host.docker.internal:8000" —
  # prometheus still has the host-gateway alias for exactly that case.
  - job_name: fastapi
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: flink
    static_configs:
      - targets: ["tradingmaster-flink:9250"]
