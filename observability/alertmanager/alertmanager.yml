# Alertmanager routing.
#
# The receiver is deliberately a no-op: this wires up the delivery path so that
# pointing alerts at email, Slack or PagerDuty is a config change rather than a
# code change. Until a real receiver is configured, alerts are visible in
# Alertmanager's own UI (http://localhost:9093) and in Prometheus.
#
# To deliver somewhere real, replace `receivers` — for example:
#   receivers:
#     - name: default
#       slack_configs:
#         - api_url_file: /etc/alertmanager/slack_url    # never inline the URL
#           channel: "#tradingmaster-alerts"
route:
  receiver: default
  group_by: ["alertname", "component"]
  group_wait: 30s
  group_interval: 5m
  # Critical alerts re-notify hourly; everything else every 12 hours.
  repeat_interval: 12h
  routes:
    - matchers: ['severity = "critical"']
      receiver: default
      repeat_interval: 1h

receivers:
  - name: default

inhibit_rules:
  # A stale archive is implied by a failing one — don't page twice.
  - source_matchers: ['alertname = "EodArchiveFailed"']
    target_matchers: ['alertname = "EodArchiveStale"']
    equal: ["component"]
