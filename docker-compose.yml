services:

  postgres:
    image: postgres:16
    container_name: tradingmaster-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: tradingmaster
    ports:
      # Host port is overridable: 5432 is often already taken by a system or
      # other-project PostgreSQL. Set POSTGRES_HOST_PORT=5433 in .env (and match
      # it in TIMESCALE_URL) rather than fighting over the default.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      # A named volume, so `docker compose down` / recreating the container does
      # not silently keep a database that was initialised with different
      # credentials — POSTGRES_PASSWORD is only applied on first init.
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d tradingmaster"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Schema migration — runs to completion, then exits. The api and flink
  # services wait for it (`service_completed_successfully`), so a fresh
  # `docker compose up` always has the right schema before anything touches the
  # database. `alembic upgrade head` is idempotent, so this is a no-op on an
  # already-current database.
  #
  # Deliberately NOT behind a profile: if it did not run, the API would refuse
  # to start (app/models/schema_check.py) and the error would look like a bug
  # rather than a missing step.
  migrate:
    build:
      context: .
    image: tradingmaster-api:${TM_IMAGE_TAG:-dev}
    container_name: tradingmaster-migrate
    command: ["alembic", "upgrade", "head"]
    environment:
      TIMESCALE_URL: "postgresql+asyncpg://user:mysecretpassword@postgres:5432/tradingmaster"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ── The application ──────────────────────────────────────────────────────────
  # Serves the REST API, the live WebSocket stream and the built UI, and runs
  # the exchange collector in its own lifespan.
  #
  # Exactly ONE of these may run at a time — this container or a host-run
  # `uvicorn app.main:app`. Two would open duplicate exchange streams and
  # publish every candle twice (the same reason k8s must not scale it; see
  # A04-5 in docs/SECURITY_AUDIT.md).
  api:
    build:
      context: .
    image: tradingmaster-api:${TM_IMAGE_TAG:-dev}
    container_name: tradingmaster-api
    # .env supplies the settings; the overrides below replace the few that are
    # host-relative (localhost means *this container* in here).
    env_file:
      - .env
    environment:
      TIMESCALE_URL: "postgresql+asyncpg://user:mysecretpassword@postgres:5432/tradingmaster"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"   # INTERNAL listener — see the kafka service
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
      # The UI is same-origin here (FastAPI serves the bundle), so no CORS.
      CORS_ALLOW_ORIGINS: ""
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    volumes:
      # EOD archive output. A named volume so Parquet files survive the
      # container — in the image this path is owned by the non-root appuser.
      - archive_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # One-shot end-of-day archive, for testing the job by hand:
  #   docker compose run --rm eod-archive 2026-10-03
  #   docker compose run --rm eod-archive 2026-10-03 --dry-run
  eod-archive:
    profiles: ["tools"]
    build:
      context: .
    image: tradingmaster-api:${TM_IMAGE_TAG:-dev}
    entrypoint: ["python", "-m", "app.eod_runner"]
    env_file:
      - .env
    environment:
      TIMESCALE_URL: "postgresql+asyncpg://user:mysecretpassword@postgres:5432/tradingmaster"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
    volumes:
      - archive_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  kafka:
    image: apache/kafka:3.9.0
    hostname: kafka
    container_name: tradingmaster-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Two listeners: PLAINTEXT (advertised as localhost) for host-run processes
      # like `uvicorn app.main:app` or `python -m app.producer_runner`, and
      # INTERNAL (advertised as the container's own DNS name) for other compose
      # services on the Docker network — e.g. the `flink` container, which
      # can't reach "localhost:9092" (that's itself, not the broker).
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    healthcheck:
      # "Up" is not the same as "accepting API requests" — the broker takes a
      # few seconds after the container starts, and a producer that connects in
      # that window just errors.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  flink:
    build:
      context: .
      dockerfile: app/flink_jobs/Dockerfile
    image: tradingmaster-flink:${TM_IMAGE_TAG:-dev}
    container_name: tradingmaster-flink
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092   # INTERNAL listener — see kafka service
      TIMESCALE_JDBC_URL: jdbc:postgresql://postgres:5432/tradingmaster
      TIMESCALE_USER: user
      TIMESCALE_PASS: mysecretpassword
      OTEL_ENABLED: "true"
      FLINK_METRICS_PROMETHEUS_PORT: "9250-9260"
      # Checkpoints commit Kafka offsets — a restarted job resumes from them.
      FLINK_CHECKPOINT_INTERVAL: "30s"
      # How often new candle topics (pairs added through the API) are discovered.
      FLINK_TOPIC_DISCOVERY_INTERVAL: "60s"
    ports:
      - "9250:9250"   # Flink's own Prometheus metrics reporter
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      # Waiting for the API means the exchanges/symbols seeder has run. Starting
      # first would read an empty exchanges table and fall back to the
      # subscribe-to-everything pattern (job_config.CATCH_ALL_TOPIC_PATTERN).
      api:
        condition: service_healthy

  # ── Front-end (optional) ─────────────────────────────────────────────────────
  # The UI also runs without this service: `cd frontend && npm run dev` (proxying
  # to the API), or built into the API image (see Dockerfile). This service is
  # the "UI as its own deployable" variant — nginx serving the bundle and
  # proxying /api to the API, which runs on the host in this Compose setup.
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: tradingmaster-frontend:${TM_IMAGE_TAG:-dev}
    container_name: tradingmaster-frontend
    environment:
      # The api service inside this network. Override to
      # "host.docker.internal:8000" if you are running the API on the host
      # instead (and start it with --host 0.0.0.0, or the container gets a 502).
      API_HOST: "${FRONTEND_API_HOST:-api:8000}"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # still available for the host-API variant
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5174:8080"

  # ── Stage 2: Prometheus + Grafana ────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: tradingmaster-prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets Prometheus scrape the host-run FastAPI app
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: tradingmaster-alertmanager
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"

  grafana:
    image: grafana/grafana:11.3.0
    container_name: tradingmaster-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"     # local-dev convenience only
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki

  # ── Stage 3: Jaeger ───────────────────────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: tradingmaster-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP

  # ── Stage 4: Loki + Promtail ──────────────────────────────────────────────────
  loki:
    image: grafana/loki:3.2.1
    container_name: tradingmaster-loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail:3.2.1
    container_name: tradingmaster-promtail
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

volumes:
  postgres_data:
  archive_data:
  prometheus_data:
  grafana_data: