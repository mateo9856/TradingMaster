services:

  postgres:
    image: postgres:16
    container_name: tradingmaster-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: tradingmaster
    ports:
      - "5432:5432"

  kafka:
    image: apache/kafka:3.9.0
    hostname: kafka
    container_name: tradingmaster-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Two listeners: PLAINTEXT (advertised as localhost) for host-run processes
      # like `uvicorn app.main:app` or `python -m app.producer_runner`, and
      # INTERNAL (advertised as the container's own DNS name) for other compose
      # services on the Docker network — e.g. the `flink` container, which
      # can't reach "localhost:9092" (that's itself, not the broker).
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  flink:
    build:
      context: .
      dockerfile: app/flink_jobs/Dockerfile
    container_name: tradingmaster-flink
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092   # INTERNAL listener — see kafka service
      TIMESCALE_JDBC_URL: jdbc:postgresql://postgres:5432/tradingmaster
      TIMESCALE_USER: user
      TIMESCALE_PASS: mysecretpassword
      OTEL_ENABLED: "true"
      FLINK_METRICS_PROMETHEUS_PORT: "9250-9260"
      # Checkpoints commit Kafka offsets — a restarted job resumes from them.
      FLINK_CHECKPOINT_INTERVAL: "30s"
      # How often new candle topics (pairs added through the API) are discovered.
      FLINK_TOPIC_DISCOVERY_INTERVAL: "60s"
    ports:
      - "9250:9250"   # Flink's own Prometheus metrics reporter
    depends_on:
      - kafka
      - postgres

  # ── Stage 2: Prometheus + Grafana ────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: tradingmaster-prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets Prometheus scrape the host-run FastAPI app
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.3.0
    container_name: tradingmaster-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"     # local-dev convenience only
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki

  # ── Stage 3: Jaeger ───────────────────────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: tradingmaster-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP

  # ── Stage 4: Loki + Promtail ──────────────────────────────────────────────────
  loki:
    image: grafana/loki:3.2.1
    container_name: tradingmaster-loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail:3.2.1
    container_name: tradingmaster-promtail
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

volumes:
  prometheus_data:
  grafana_data: