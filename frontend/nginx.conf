# nginx config for the standalone front-end container.
#
# Serves the built SPA and proxies the two API surfaces to the API service, so
# the browser still talks to a single origin and no CORS config is involved.
# ${API_HOST} is substituted at container start by the nginx image's envsubst
# entrypoint, which only touches variables that exist in the environment — so
# nginx's own $uri / $host / $http_upgrade survive untouched.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers. These have to be repeated in every location block that
    # sets add_header itself — nginx's add_header does not inherit into a block
    # that declares its own. Kept in step with app/middleware/security_headers.py,
    # which covers the FastAPI-served copy of the same bundle.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Client-side routes (/history, /system, …) must return the app, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames — safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        # Repeated because this block declares its own add_header.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location /api/ {
        proxy_pass http://${API_HOST}/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The live candle stream is a WebSocket upgrade on the same prefix.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }

    location = /health {
        proxy_pass http://${API_HOST}/health;
    }

    location = /metrics {
        proxy_pass http://${API_HOST}/metrics;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
