# Alembic configuration — see README "Database migrations".
#
# The database URL is deliberately NOT set here: migrations/env.py resolves it
# from ALEMBIC_DATABASE_URL, falling back to app.config.TIMESCALE_URL, so there
# is exactly one place a connection string is configured (the environment) and
# no credential ever lands in a tracked file.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# Revision files sort chronologically: 2026_09_27_1430-ab12cd34ef56_add_thing.py
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
